<!-- Supabase → Authentication → Emails → "Reset password".
     Subject: Reset your Ware Print password
     Paste everything below this comment into the "Message body" box. -->
<div style="margin:0;padding:24px 12px;background:#f7f7f4;font-family:Arial,Helvetica,sans-serif;color:#151515">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d6d6d1">
    <div style="height:4px;background:#c8102e"></div>
    <div style="padding:18px 28px;border-bottom:1px solid #d6d6d1;font-size:14px;font-weight:bold;letter-spacing:3px">WARE&nbsp;PRINT</div>
    <div style="padding:28px">
      <h1 style="margin:0 0 12px;font-size:20px">Choose a new password</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#45453f">
        Someone asked to reset the password for your Ware Print account. Press the button to choose a new one.
        The link works once.
      </p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
         style="display:inline-block;background:#c8102e;color:#ffffff;padding:12px 20px;font-size:14px;font-weight:bold;text-decoration:none">
        Choose a new password
      </a>
      <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b6b64">
        If you did not ask for this, ignore this email — your password stays the same.
      </p>
    </div>
  </div>
</div>
